    /* ── HEADER — already done for you ── */

      background: white;
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo { font-size: 1.2em; font-weight: 800; letter-spacing: -0.04em; color: var(--accent); }
    .logo span { color: var(--text); }
    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; font-size: 0.75em; font-weight: 700; display: flex; align-items: center; justify-content: center; }

    /* ── PAGE LAYOUT — already done for you ── */
    .main { max-width: 600px; margin: 0 auto; padding: 28px 20px; display: flex; flex-direction: column; gap: 16px; }

    /* ── CARD — already done for you ── */
    .card { background: var(--card); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
    .card-title { font-size: 0.72em; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }

    /* ── FORM ELEMENTS — already done for you ── */
    .field { margin-bottom: 14px; }
    .field-label { display: block; font-size: 0.72em; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
    .field-prefix-wrap { position: relative; }
    .field-prefix { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-weight: 600; color: var(--muted); font-size: 0.9em; pointer-events: none; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 12px 14px; border: 2px solid var(--border);
      border-radius: var(--r-sm); font-size: 0.95em; font-family: inherit;
      color: var(--text); background: var(--bg); outline: none; transition: border-color 0.15s;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent); background: white; }
    .input-with-prefix { padding-left: 30px; }

    /* ── BUTTON — already done for you ── */
    .btn {
      display: block; width: 100%; padding: 13px;
      border: none; border-radius: var(--r-sm);
      font-size: 0.95em; font-family: inherit; font-weight: 700;
      background: var(--accent); color: white; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.9; }
