<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Roster (Printable) — NovaPay Workshop</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1A1D29;--muted:#6B7280;--border:#D8DCE6;--accent:#5A50E0;--green:#00875F;--paper:#FFFFFF;--shade:#F4F5F9}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--shade);color:var(--ink);font-size:13px;padding:32px 0 80px}
.page{max-width:900px;margin:0 auto;background:var(--paper);padding:36px 44px;box-shadow:0 0 0 1px var(--border)}
.print-btn{max-width:900px;margin:0 auto 16px;text-align:right}
.print-btn button{background:var(--accent);color:white;border:none;padding:10px 22px;border-radius:8px;font-family:inherit;font-weight:700;font-size:0.85em;cursor:pointer}
.doc-header{text-align:center;padding-bottom:16px;border-bottom:3px solid var(--ink);margin-bottom:16px}
.doc-logo{font-size:1.05em;font-weight:900;letter-spacing:-0.03em;color:var(--accent)}
.doc-logo span{color:var(--ink)}
.doc-title{font-size:1.5em;font-weight:900;letter-spacing:-0.03em;margin-top:6px}
.doc-sub{font-size:0.82em;color:var(--muted);margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:0.82em;margin-top:8px}
th{text-align:left;font-size:0.68em;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);padding:8px 6px;border-bottom:2px solid var(--ink)}
td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:middle}
.name-col{width:16%}.user-col{width:18%}.check-col{width:11%;text-align:center}
.box{width:16px;height:16px;border:1.5px solid var(--ink);border-radius:3px;display:inline-block}
.footer-note{text-align:center;font-size:0.78em;color:var(--muted);margin-top:20px;padding-top:14px;border-top:2px solid var(--ink);line-height:1.6}
@media print{body{background:white;padding:0;font-size:11px}.page{box-shadow:none;padding:14px 10px;max-width:100%}.print-btn{display:none}}
</style>
</head>
<body>
<div class="print-btn"><button onclick="window.print()">🖨 Print this roster</button></div>
<div class="page">
  <div class="doc-header">
    <div class="doc-logo">nova<span>pay</span></div>
    <div class="doc-title">Student Roster</div>
    <div class="doc-sub">Tick each box as you confirm it — a glance replaces a memory check</div>
  </div>
  <table>
    <thead><tr>
      <th class="name-col">Name</th>
      <th class="user-col">GitHub username</th>
      <th class="check-col">Account created</th>
      <th class="check-col">Repo copied</th>
      <th class="check-col">Codespace open</th>
      <th class="check-col">Nova confirmed</th>
      <th>Notes</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="footer-note">Nova confirmed = asked Copilot Chat "Who are you?" and got a NovaPay-mentor answer, not a generic one.</div>
</div>
<script>
  let html = '';
  for (let i = 0; i < 30; i++) {
    html += `<tr>
      <td>&nbsp;</td><td>&nbsp;</td>
      <td style="text-align:center"><div class="box"></div></td>
      <td style="text-align:center"><div class="box"></div></td>
      <td style="text-align:center"><div class="box"></div></td>
      <td style="text-align:center"><div class="box"></div></td>
      <td>&nbsp;</td>
    </tr>`;
  }
  document.getElementById('rows').innerHTML = html;
</script>
</body>
</html>
